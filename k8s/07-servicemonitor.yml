apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api-monitor
  namespace: todo-app
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend-api
  endpoints:
    - port: "8080"
      path: /actuator/prometheus
      interval: 15s
  namespaceSelector:
    matchNames:
      - todo-app
